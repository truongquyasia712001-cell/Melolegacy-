name: Validate MeloLegacy PDF OMR integration

on:
  pull_request:
    branches: [main, feature/audiveris-omr-pdf]
  push:
    branches: [feature/audiveris-omr-pdf, feature/melolegacy-3d-ecosystem-map, feature/omr-piano-reading-playback]

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: melolegacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: melolegacy/package-lock.json
      - run: npm install
      - run: npm run build

  omr-service-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m compileall -q melolegacy/omr-service/app
      - name: Build Audiveris OMR container
        run: docker build -t melolegacy-omr:ci melolegacy/omr-service
      - name: Start OMR service
        run: docker run -d --name melolegacy-omr-ci -p 8080:8080 -e OMR_ENV=development -v omr-ci-data:/data melolegacy-omr:ci
      - name: Verify Audiveris engine and API health
        run: |
          for attempt in {1..45}; do
            if curl -fsS http://localhost:8080/health > /tmp/omr-health.json; then break; fi
            sleep 2
          done
          cat /tmp/omr-health.json
          grep -q '"engine_available":"true"' /tmp/omr-health.json
          docker exec melolegacy-omr-ci /opt/audiveris/bin/Audiveris -help
      - name: Generate a synthetic sheet-music PDF fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y lilypond
          lilypond -o /tmp/melolegacy-omr-fixture melolegacy/omr-service/tests/generate_fixture.ly
          test -s /tmp/melolegacy-omr-fixture.pdf
      - name: Run PDF through Audiveris and assert MusicXML output
        run: |
          curl -fsS -F "pdf=@/tmp/melolegacy-omr-fixture.pdf" http://localhost:8080/v1/jobs > /tmp/omr-job.json
          JOB_ID=$(python3 -c "import json; print(json.load(open('/tmp/omr-job.json'))['id'])")
          echo "OMR job: $JOB_ID"
          for attempt in {1..180}; do
            curl -fsS "http://localhost:8080/v1/jobs/$JOB_ID" > /tmp/omr-status.json
            STATUS=$(python3 -c "import json; print(json.load(open('/tmp/omr-status.json'))['status'])")
            if [ "$STATUS" = "completed" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then
              cat /tmp/omr-status.json
              exit 1
            fi
            sleep 2
          done
          test "$STATUS" = "completed"
          curl -fsS "http://localhost:8080/v1/jobs/$JOB_ID/musicxml" > /tmp/omr-result.musicxml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/omr-result.musicxml').getroot()
          actual = []
          for note in (node for node in root.iter() if node.tag.endswith('note')):
              if any(child.tag.endswith('rest') for child in note):
                  continue
              pitch = next((child for child in note if child.tag.endswith('pitch')), None)
              if pitch is None:
                  continue
              step = next((child.text for child in pitch if child.tag.endswith('step')), None)
              octave = next((child.text for child in pitch if child.tag.endswith('octave')), None)
              note_type = next((child.text for child in note if child.tag.endswith('type')), None)
              actual.append((step, octave, note_type))

          expected = [
              ('C', '4', 'quarter'),
              ('D', '4', 'quarter'),
              ('E', '4', 'quarter'),
              ('F', '4', 'quarter'),
              ('G', '4', 'half'),
              ('E', '4', 'half'),
          ]
          matches = sum(a == e for a, e in zip(actual, expected))
          accuracy = matches / len(expected)
          print(f'OMR fixture note accuracy: {matches}/{len(expected)} = {accuracy:.1%}')
          print(f'Expected sequence: {expected}')
          print(f'Actual sequence:   {actual}')
          if len(actual) != len(expected) or accuracy < 0.90:
              raise SystemExit('OMR fixture failed the 90% note pitch/octave/duration acceptance threshold.')
          PY
      - name: Stop OMR service
        if: always()
        run: docker rm -f melolegacy-omr-ci || true
